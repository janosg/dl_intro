# Environment to build the course web page (https://dl-intro.readthedocs.io).
#
# Read the Docs syncs this project (see .readthedocs.yml). To build the page locally, run
# `uv run --project docs sphinx-build -b html docs/source docs/build/html` from the
# repository root.

[project]
name = "dl-intro-docs"
version = "0.0.1"
description = "Sphinx environment for the course web page of Intro to Deep Learning"
requires-python = ">=3.12"
dependencies = [
    "sphinx",
    "nbsphinx",
    "myst-parser",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-design",
    # syntax highlighting of notebook cells in nbsphinx
    "ipython",
]

[tool.uv]
package = false
