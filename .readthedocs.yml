---
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    # nbsphinx needs pandoc to convert the markdown cells of notebooks
    - pandoc
python:
  install:
    - method: uv
      command: sync
      path: docs
sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: false
